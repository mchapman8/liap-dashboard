<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LIAP — Project Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #161617;
    --card: #1c1c1e;
    --card-hover: #242426;
    --border: rgba(255,255,255,0.08);
    --border-med: rgba(255,255,255,0.14);
    --text: #f0ede8;
    --muted: #8e8b85;
    --hint: #545250;
    --accent: #c9a96e;
    --accent-dim: rgba(201,169,110,0.12);
    --red: #e05c5c;
    --red-dim: rgba(224,92,92,0.12);
    --amber: #d4894a;
    --amber-dim: rgba(212,137,74,0.12);
    --green: #5dab7f;
    --green-dim: rgba(93,171,127,0.12);
    --blue: #5b8fc9;
    --blue-dim: rgba(91,143,201,0.12);
    --purple: #8b7fd4;
    --purple-dim: rgba(139,127,212,0.12);
    --pink: #c96b8f;
    --pink-dim: rgba(201,107,143,0.12);
    --gray-dim: rgba(142,139,133,0.12);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-pill: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 0 0 120px 0;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    padding: 56px 20px 20px;
    border-bottom: 0.5px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .header-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .header-title {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 300;
    color: var(--text);
    line-height: 1.2;
  }
  .last-updated {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--hint);
    text-align: right;
    padding-top: 4px;
  }

  /* FILTER TABS */
  .filter-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .tab {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    border: 0.5px solid var(--border-med);
    background: transparent;
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-appearance: none;
  }
  .tab.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* MAIN CONTENT */
  .content { padding: 20px 16px 0; }

  /* SECTION HEADERS */
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--hint);
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-left: 2px;
  }

  /* PRIORITY SECTION */
  .priority-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 16px;
    margin-bottom: 10px;
  }
  .priority-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .priority-item:last-child { border-bottom: none; padding-bottom: 0; }
  .priority-item:first-child { padding-top: 0; }
  .priority-num {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--accent);
    line-height: 1;
    min-width: 28px;
    padding-top: 2px;
  }
  .priority-text { flex: 1; }
  .priority-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
  }
  .priority-sub {
    font-size: 12px;
    color: var(--muted);
  }

  /* CONFLICTS SECTION */
  .conflict-card {
    background: var(--red-dim);
    border-radius: var(--radius);
    border: 0.5px solid rgba(224,92,92,0.2);
    padding: 16px;
    margin-bottom: 10px;
  }
  .conflict-item {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 0.5px solid rgba(224,92,92,0.15);
    align-items: flex-start;
  }
  .conflict-item:last-child { border-bottom: none; padding-bottom: 0; }
  .conflict-item:first-child { padding-top: 0; }
  .conflict-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    margin-top: 6px;
    flex-shrink: 0;
  }
  .conflict-text {
    font-size: 13px;
    color: #e8a0a0;
    line-height: 1.5;
  }

  /* PROJECT CARDS */
  .project-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .project-card.expanded { border-color: var(--border-med); }

  .project-header {
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .project-header:active { background: var(--card-hover); }

  .project-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    flex-shrink: 0;
  }

  .project-meta { flex: 1; min-width: 0; }
  .project-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .project-client {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  /* PROGRESS BAR */
  .progress-wrap { display: flex; align-items: center; gap: 8px; }
  .progress-bar-bg {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill { height: 3px; border-radius: 2px; transition: width 0.3s; }
  .progress-pct {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--hint);
    min-width: 28px;
    text-align: right;
  }

  .project-badges {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .chevron {
    font-size: 12px;
    color: var(--hint);
    margin-left: 4px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .expanded .chevron { transform: rotate(180deg); }

  /* BADGE */
  .badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
    letter-spacing: 0.04em;
  }

  /* EXPANDED BODY */
  .project-body {
    padding: 0 16px 16px;
    border-top: 0.5px solid var(--border);
    display: none;
  }
  .project-card.expanded .project-body { display: block; }

  .project-summary {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    padding: 12px 0;
    border-bottom: 0.5px solid var(--border);
  }

  /* NEXT ACTION BOX */
  .next-action {
    background: var(--accent-dim);
    border-radius: var(--radius-sm);
    border: 0.5px solid rgba(201,169,110,0.2);
    padding: 10px 12px;
    margin: 12px 0;
  }
  .next-action-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .next-action-text {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  /* SECTION DIVIDER */
  .body-section {
    margin-top: 14px;
  }
  .body-section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--hint);
    margin-bottom: 8px;
  }

  /* TASKS */
  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .task-item:last-child { border-bottom: none; }
  .task-item:active { opacity: 0.7; }
  .task-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--border-med);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .task-check.done {
    border-color: var(--green);
    background: var(--green);
  }
  .task-check.done::after {
    content: '';
    width: 6px;
    height: 4px;
    border-left: 1.5px solid #0e0e0f;
    border-bottom: 1.5px solid #0e0e0f;
    transform: rotate(-45deg) translateY(-1px);
  }
  .task-label {
    flex: 1;
    font-size: 13px;
    color: var(--text);
    transition: color 0.15s;
  }
  .task-label.done {
    color: var(--hint);
    text-decoration: line-through;
  }
  .task-note {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--hint);
  }

  /* INVOICES */
  .invoice-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .invoice-item:last-child { border-bottom: none; }
  .invoice-item:active { opacity: 0.7; }
  .invoice-id {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 90px;
  }
  .invoice-label {
    flex: 1;
    font-size: 12px;
    color: var(--muted);
  }
  .invoice-amount {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text);
    font-weight: 500;
  }

  /* FLAGS */
  .flag-item {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 0.5px solid var(--border);
    align-items: flex-start;
  }
  .flag-item:last-child { border-bottom: none; }
  .flag-arrow {
    font-size: 12px;
    color: var(--amber);
    margin-top: 1px;
    flex-shrink: 0;
  }
  .flag-text {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* DEADLINE */
  .deadline-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .deadline-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    min-width: 70px;
  }
  .deadline-value {
    font-size: 13px;
    color: var(--muted);
  }

  /* INVOICE STATUS CYCLE HINT */
  .tap-hint {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--hint);
    text-align: center;
    padding-top: 6px;
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--hint);
    font-size: 13px;
  }

  /* SECTION SPACING */
  .section { margin-bottom: 28px; }

</style>
</head>

// ─── LOCAL STORAGE ──────────────────────────────────────────────────────────

function getStorage() {
  try {
    return JSON.parse(localStorage.getItem('liap_state') || '{}');
  } catch(e) { return {}; }
}

function saveStorage(state) {
  try {
    localStorage.setItem('liap_state', JSON.stringify(state));
  } catch(e) {}
}

function getTaskState(taskId, defaultDone) {
  const s = getStorage();
  return s['task_' + taskId] !== undefined ? s['task_' + taskId] : defaultDone;
}

function toggleTask(taskId, defaultDone) {
  const s = getStorage();
  const current = s['task_' + taskId] !== undefined ? s['task_' + taskId] : defaultDone;
  s['task_' + taskId] = !current;
  saveStorage(s);
  render();
}

function getInvStatus(invKey, defaultStatus) {
  const s = getStorage();
  return s['inv_' + invKey] || defaultStatus;
}

function cycleInvStatus(invKey, defaultStatus) {
  const s = getStorage();
  const current = s['inv_' + invKey] || defaultStatus;
  const idx = INV_STATUSES.indexOf(current);
  const next = INV_STATUSES[(idx + 1) % INV_STATUSES.length];
  s['inv_' + invKey] = next;
  saveStorage(s);
  render();
}

// ─── STATE ──────────────────────────────────────────────────────────────────

let currentFilter = 'all';
let expandedId = null;

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function toggleProject(id) {
  expandedId = expandedId === id ? null : id;
  render();
}

// ─── BADGE HELPER ───────────────────────────────────────────────────────────

function badge(label, bg, color, border) {
  return `<span class="badge" style="background:${bg};color:${color};border:0.5px solid ${border||'transparent'}">${label}</span>`;
}

// ─── RENDER ─────────────────────────────────────────────────────────────────

function render() {
  const container = document.getElementById('mainContent');
  let html = '';

  // PRIORITY SECTION
  if (currentFilter === 'all') {
    html += `<div class="section">
      <div class="section-label">This week — priority focus</div>
      <div class="priority-card">
        ${PRIORITY.map((p, i) => `
          <div class="priority-item">
            <div class="priority-num">${i + 1}</div>
            <div class="priority-text">
              <div class="priority-title">${p.title}</div>
              <div class="priority-sub">${p.sub}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;

    // CONFLICTS SECTION
    html += `<div class="section">
      <div class="section-label">Potential conflicts — non-LIAP</div>
      <div class="conflict-card">
        ${CONFLICTS.map(c => `
          <div class="conflict-item">
            <div class="conflict-dot"></div>
            <div class="conflict-text">${c}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  // PROJECTS
  const filtered = currentFilter === 'all'
    ? PROJECTS
    : PROJECTS.filter(p => p.phase === currentFilter);

  if (filtered.length === 0) {
    html += `<div class="empty">No projects in this category.</div>`;
  } else {
    html += `<div class="section-label">Projects — ${filtered.length} showing</div>`;
    html += filtered.map(p => {
      const isExp = expandedId === p.id;
      const cc = CLIENT_COLORS[p.abbr] || CLIENT_COLORS.LI;
      const urg = URGENCY_STYLE[p.urgency];
      const ph = PHASE_STYLE[p.phase];

      // compute progress from live state
      const tasks = p.tasks.map(t => ({ ...t, done: getTaskState(t.id, t.done) }));
      const doneCount = tasks.filter(t => t.done).length;
      const pct = tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0;

      const taskRows = tasks.map(t => `
        <div class="task-item" onclick="toggleTask('${t.id}', ${t.done})">
          <div class="task-check ${t.done ? 'done' : ''}"></div>
          <div class="task-label ${t.done ? 'done' : ''}">${t.label}</div>
          ${t.note ? `<div class="task-note">${t.note}</div>` : ''}
        </div>
      `).join('');

      const invRows = p.invoices.map((inv, idx) => {
        const invKey = p.id + '_inv' + idx;
        const status = inv.status === 'paid' || inv.status === 'tbd' || inv.status === 'discount'
          ? inv.status
          : getInvStatus(invKey, inv.status);
        const s = INV_STYLE[status] || INV_STYLE.pending;
        const tappable = !['paid','tbd','discount'].includes(inv.status);
        return `
          <div class="invoice-item" ${tappable ? `onclick="cycleInvStatus('${invKey}', '${inv.status}')"` : ''}>
            <div class="invoice-id">${inv.id}</div>
            <div class="invoice-label">${inv.label}</div>
            <div class="invoice-amount">${inv.amount}</div>
            ${badge(s.label, s.bg, s.color, s.border)}
          </div>
        `;
      }).join('');

      const flagRows = p.flags.map(f => `
        <div class="flag-item">
          <div class="flag-arrow">→</div>
          <div class="flag-text">${f}</div>
        </div>
      `).join('');

      return `
        <div class="project-card ${isExp ? 'expanded' : ''}" id="card_${p.id}">
          <div class="project-header" onclick="toggleProject('${p.id}')">
            <div class="project-avatar" style="background:${cc.bg};color:${cc.color}">${p.abbr}</div>
            <div class="project-meta">
              <div class="project-title">${p.title}</div>
              <div class="project-client">${p.client}</div>
              <div class="progress-wrap">
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill" style="width:${pct}%;background:${cc.color}"></div>
                </div>
                <div class="progress-pct">${pct}%</div>
              </div>
            </div>
            <div class="project-badges">
              ${badge(ph.label, ph.bg, ph.color)}
              ${badge(urg.label, urg.bg, urg.color)}
            </div>
            <div class="chevron">▼</div>
          </div>
          <div class="project-body">
            <div class="project-summary">${p.summary}</div>

            <div class="next-action">
              <div class="next-action-label">Next action</div>
              <div class="next-action-text">${p.nextAction}</div>
            </div>

            <div class="deadline-row">
              <div class="deadline-label">Deadline</div>
              <div class="deadline-value">${p.deadline}</div>
            </div>

            ${tasks.length ? `
            <div class="body-section">
              <div class="body-section-label">Tasks</div>
              ${taskRows}
            </div>` : ''}

            ${p.invoices.length ? `
            <div class="body-section">
              <div class="body-section-label">Invoices — tap to update status</div>
              ${invRows}
              <div class="tap-hint">tap invoice to cycle: pending → sent → paid → check</div>
            </div>` : ''}

            ${p.flags.length ? `
            <div class="body-section">
              <div class="body-section-label">Flags</div>
              ${flagRows}
            </div>` : ''}

          </div>
        </div>
      `;
    }).join('');
  }

  container.innerHTML = html;
}

render();
</script>
